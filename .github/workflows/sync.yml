name: Sync FnDepot Index



on:

  schedule:

    - cron: '3 9 * * *'

  workflow_dispatch:



permissions:

  contents: write



concurrency:

  group: sync-fndepot

  cancel-in-progress: false



env:

  # 上游项目

  UPSTREAM_OWNER: 'guan-ry'

  UPSTREAM_REPO: 'FanControlServerApp'

  # 主应用版本（manifest 中的 version，Auto-increment 步骤会更新此行）

  APP_VERSION: '1.3.7.1'

  # 主应用 FPK 资产名（与 fnpack.json 中 download_url 保持一致）

  APP_ASSET: 'FanControlServer-v1.3.7.1-linux-amd64-iframe.fpk'



jobs:

  sync:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: Setup Node.js

        uses: actions/setup-node@v5

        with:

          node-version: '22'

          cache: 'npm'

          cache-dependency-path: frontend/package-lock.json



      - name: Setup Go

        uses: actions/setup-go@v5

        with:

          go-version: '1.25.0'

          cache: true



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.12'



      - name: Install dependencies

        run: |

          pip install requests



      - name: Install fnpack

        run: |

          curl -L -o fnpack "https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64"

          chmod +x fnpack

          sudo mv fnpack /usr/local/bin/fnpack

          fnpack --help



      - id: version

        name: Auto-increment version from upstream

        run: |

          set -euo pipefail

          CURRENT=$(grep '^version' manifest | head -n1 | sed 's/version.*= *//; s/^ *//; s/ *$//' | tr -d '\r')

          echo "Current manifest version: $CURRENT"



          # 查询上游最新版本（带重试与容错，避免偶发网络导致发布失败）

          TAG=""

          for i in 1 2 3; do

            TAG=$(curl -fsSL --max-time 30 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "User-Agent: FanControlServer" "https://api.github.com/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/releases/latest" | jq -r '.tag_name // empty' 2>/dev/null) && break

            echo "上游版本查询失败（第 ${i} 次），5 秒后重试"

            sleep 5

          done

          if [ -z "$TAG" ]; then

            echo "::error::无法获取上游 ${UPSTREAM_OWNER}/${UPSTREAM_REPO} 最新版本，请检查上游仓库或网络"

            exit 1

          fi

          echo "Upstream latest tag: $TAG"



          RAW=$(echo "$TAG" | sed 's/^[vV]//; s/[-+].*//')

          echo "Raw upstream version: $RAW"



          IFS='.' read -ra U_PARTS <<< "$RAW"

          U1=${U_PARTS[0]:-0}

          U2=${U_PARTS[1]:-0}

          U3=${U_PARTS[2]:-0}



          IFS='.' read -ra C_PARTS <<< "$CURRENT"

          C1=${C_PARTS[0]:-0}

          C2=${C_PARTS[1]:-0}

          C3=${C_PARTS[2]:-0}

          C4=${C_PARTS[3]:-0}



          echo "Upstream: $U1.$U2.$U3"

          echo "Current:  $C1.$C2.$C3.$C4"



          # 仅当上游主版本高于当前时才递增；上游未变化则跳过 bump（workflow_dispatch 仍会强制构建当前版本）

          NEED_BUMP=0

          if [ "$U1" -gt "$C1" ]; then NEED_BUMP=1; fi

          if [ "$U1" -eq "$C1" ] && [ "$U2" -gt "$C2" ]; then NEED_BUMP=1; fi

          if [ "$U1" -eq "$C1" ] && [ "$U2" -eq "$C2" ] && [ "$U3" -gt "$C3" ]; then NEED_BUMP=1; fi



          if [ "$NEED_BUMP" -ne 1 ]; then

            echo "上游版本未变化（${U1}.${U2}.${U3} == ${C1}.${C2}.${C3}），跳过 bump，保持当前版本 $CURRENT"

            echo "skip=true" >> "$GITHUB_OUTPUT"

            echo "APP_VERSION=${CURRENT}" >> "$GITHUB_ENV"

            echo "APP_ASSET=FanControlServer-v${CURRENT}-linux-amd64-iframe.fpk" >> "$GITHUB_ENV"

            exit 0

          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"



          NEW_VERSION="${U1}.${U2}.${U3}.1"

          echo "Upstream changed, new version: $NEW_VERSION"



          sed -i "s/^version.*= .*/version               = $NEW_VERSION/" manifest

          NEW_ASSET="FanControlServer-v${NEW_VERSION}-linux-amd64-iframe.fpk"



          echo "Manifest updated to $NEW_VERSION (from upstream $RAW)"

          echo "APP_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"

          echo "APP_ASSET=${NEW_ASSET}" >> "$GITHUB_ENV"



      - name: Build Frontend

        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.skip != 'true'

        run: |

          cd frontend

          npm ci || (echo "npm ci 失败，回退 npm install"; npm install)

          npm run build



      - name: Verify frontend output

        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.skip != 'true'

        run: |

          if [[ ! -f "backend/web/index.html" ]]; then

            echo "错误: 未找到 backend/web/index.html"

            exit 1

          fi



      - name: Build Backend (linux/amd64)

        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.skip != 'true'

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          mkdir -p app/server

          cd backend

          go mod tidy

          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X fancontrolserver/internal/version.Version=${APP_VERSION}" -o ../app/server/fancontrolserver .



      - name: Sync manifest desc from README.md

        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.skip != 'true'

        run: |

          python scripts/sync_app_desc.py



      - name: Build FanControlServer FPK (with built-in driver)

        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.skip != 'true'

        run: |

          # 复用仓库已有图标，确保 fnpack 必需文件存在（ICON.PNG / ICON_256.PNG / icon_64.png）

          cp -f app/ui/images/icon_256.png ICON_256.PNG

          cp -f app/ui/images/icon_256.png ICON.PNG

          cp -f app/ui/images/icon_64.png icon_64.png

          fnpack build

          mkdir -p dist

          mv *.fpk "dist/${APP_ASSET}"

          ls -lh dist/



      - name: Sync CHANGELOG from source

        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.skip != 'true'

        run: |

          python scripts/sync_changelog.py



      - name: Upload FPK to Release

        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.skip != 'true'

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          set -euo pipefail

          TAG="v${APP_VERSION}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then

            gh release create "$TAG" --title "FanControlServer（定制版） $TAG" --notes-file CHANGELOG.md

          else

            gh release edit "$TAG" --notes-file CHANGELOG.md

          fi

          gh release upload "$TAG" "dist/${APP_ASSET}" --clobber



      - name: Generate fnpack.json from local builds

        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.skip != 'true'

        run: python scripts/gen_fnpack.py



      - name: Generate FnDepot app directory

        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.skip != 'true'

        run: |

          python scripts/gen_fndepot.py



      - name: Commit and push if changed

        if: github.event_name == 'workflow_dispatch' || steps.version.outputs.skip != 'true'

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.com"

          git add manifest fnpack.json CHANGELOG.md docs/CHANGELOG_SRC.md FanControlServer/

          git commit -m "ci: auto-increment version $NEW_VERSION (upstream $(echo $TAG | sed 's/^[vV]//; s/[-+].*//'))" || echo "no changes to commit"

          git push

